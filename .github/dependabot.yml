version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR per week instead of one PR per action.
    # Major version bumps are kept in their own PRs for manual review.
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"

  # The site-check action's own packages (playwright-core, axe-core).
  - package-ecosystem: "npm"
    directory: "/.github/actions/site-check"
    schedule:
      interval: "weekly"
    groups:
      site-check-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
