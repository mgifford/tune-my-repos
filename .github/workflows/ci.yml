name: CI

# Runs the deterministic test suite on every pull request and push to main.
# This is the required check that Phase 3's auto-merge path gates on: no
# update is ever eligible for auto-merge unless this check passed on its
# head commit.

on:
  pull_request:
  push:
    branches: [main]
  # Lets Maintenance Inventory start this check on its own data-update PR:
  # pushes made with a workflow's GITHUB_TOKEN never trigger pull_request
  # or push workflows, but workflow_dispatch is allowed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run tests
        run: npm test
