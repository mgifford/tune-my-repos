name: Accessibility Scan

# Scans the GitHub Pages site for accessibility issues using the
# GitHub accessibility-scanner marketplace action:
# https://github.com/marketplace/actions/accessibility-scanner
#
# Prerequisites – before this workflow can succeed you must:
#   1. Enable GitHub Pages for this repository (Settings → Pages).
#   2. Create a fine-grained Personal Access Token (PAT) with the
#      following repository permissions for your repository:
#        actions: write, contents: write, issues: write,
#        pull-requests: write, metadata: read
#   3. Add that token as a repository secret named GH_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Note: GitHub Actions' default GITHUB_TOKEN cannot be used here
# because the action needs to create issues and (optionally) open PRs.

on:
  push:
    branches: [main]
  schedule:
    # 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-scan:
    name: Accessibility / GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - uses: github/accessibility-scanner@v2
        with:
          # The URL below uses the standard GitHub Pages pattern:
          #   https://<owner>.github.io/<repo>/
          # If your site uses a custom domain, replace this with the real URL.
          urls: |
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_TOKEN }}
          cache_key: ${{ github.repository }}-main
          # Set to true if GitHub Copilot is not available on this account.
          # When false, Copilot will be assigned to auto-fix filed issues.
          skip_copilot_assignment: true
