name: Accessibility Scan

# Scans the GitHub Pages site for accessibility issues using the
# GitHub accessibility-scanner marketplace action:
# https://github.com/marketplace/actions/accessibility-scanner
#
# Prerequisites – before this workflow can succeed you must:
#   1. Enable GitHub Pages for this repository (Settings → Pages).
#
# This workflow uses the built-in GITHUB_TOKEN (with issues: write permission)
# to file accessibility findings as GitHub Issues.  No personal access token
# (PAT) or extra secret is required.
#
# If you prefer a PAT, create a fine-grained token with these repository
# permissions: issues: write, contents: read, metadata: read – then store it
# as a secret named GH_TOKEN and change `token: ${{ github.token }}` below
# to `token: ${{ secrets.GH_TOKEN }}`.

on:
  push:
    branches: [main]
  schedule:
    # 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  accessibility-scan:
    name: Accessibility / GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # Wait for GitHub Pages to finish deploying the latest commit before
      # scanning.  This avoids a race condition where the scan runs against
      # the previous version of the site (Pages deployments can take up to
      # ~60 seconds after a push lands on main).
      - name: Wait for GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;
            const sha      = context.sha;
            const maxWaitMs = 120000;  // 2-minute ceiling
            const pollMs    = 10000;   // check every 10 s
            const deadline  = Date.now() + maxWaitMs;
            let   resolved  = false;

            console.log(`Waiting for Pages deployment of ${sha} …`);
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages', per_page: 10,
              });
              // Find the deployment that matches the current commit SHA.
              const deployment = deployments.find(d => d.sha === sha);
              if (deployment) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 1,
                });
                const state = statuses[0]?.state;
                console.log(`Deployment state: ${state}`);
                if (state === 'success') {
                  console.log('GitHub Pages deployment complete.');
                  resolved = true;
                  break;
                }
                if (state === 'failure' || state === 'error') {
                  core.warning(`Pages deployment status is "${state}" – proceeding with scan anyway.`);
                  resolved = true;
                  break;
                }
              } else {
                console.log('No Pages deployment found for this commit yet – will retry.');
              }
              await new Promise(r => setTimeout(r, pollMs));
            }
            if (!resolved) {
              core.warning('Timed out waiting for GitHub Pages deployment. Scanning the current live site, which may not reflect the latest commit.');
            }

      - uses: github/accessibility-scanner@v2
        with:
          # The URL below uses the standard GitHub Pages pattern:
          #   https://<owner>.github.io/<repo>/
          # If your site uses a custom domain, replace this with the real URL.
          urls: |
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          cache_key: ${{ github.repository }}-main
          # Set to true if GitHub Copilot is not available on this account.
          # When false, Copilot will be assigned to auto-fix filed issues.
          skip_copilot_assignment: true
