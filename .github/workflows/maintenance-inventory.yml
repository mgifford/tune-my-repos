name: Maintenance Inventory

# Deterministic, scheduled inventory of Dependabot alerts and update PRs for
# repositories in maintenance-policy.json's scope. No AI involved. This
# workflow reads data and writes a redacted, bounded maintenance-rollup.json
# artifact; it never mutates any repository it scans. The exceptions are two
# files in THIS repository, committed back to main after a non-dry-run —
# maintenance-scan-state.json and maintenance-rollup.public.json — which is
# why this workflow has contents: write — see "Publishing" below.
#
# Modes:
#   - Public dry-run (default): no secret required, runs with reduced
#     coverage (Dependabot alerts require authentication even on public
#     repos, so dry-run output will show "unknown" for that field).
#   - Authenticated: set the MAINTENANCE_RO_TOKEN repository secret to a
#     fine-grained PAT with read-only Dependabot alerts + Administration
#     (Metadata is automatic) — see README "Setting up MAINTENANCE_RO_TOKEN".
#     The workflow still runs without this secret; it simply has less coverage.
#
# Publishing:
#   maintenance-scan-state.json tracks when each discovered repository was
#   last scanned, so repeat runs can skip the expensive PR/CI-status work
#   for repositories unchanged since their last scan (always rechecking
#   Dependabot alerts regardless — see policy/scan-state.cjs).
#
#   maintenance-rollup.public.json is the reduced rollup (see
#   policy/public-redaction.cjs) actually served by GitHub Pages at
#   maintenance.html — it never contains exact Dependabot alert counts,
#   only the has_urgent_alerts boolean, which is why it is safe to publish
#   even though this page has no authentication. The full rollup with exact
#   counts (maintenance-rollup.json) stays in the private workflow artifact
#   only and is never committed.
#
#   A non-dry-run that changed either file opens a single small pull
#   request containing just those files, starts the required "npm test"
#   check on it (GITHUB_TOKEN pushes never trigger CI by themselves, so it
#   is dispatched explicitly), waits for it to pass (the same ruleset that
#   applies to every other change to main), merges it, and requests a Pages
#   build (a merge made with GITHUB_TOKEN does not trigger one either) —
#   using the workflow's own GITHUB_TOKEN, no external secret. This keeps the required check meaningful for every
#   change to main, including this automated one, rather than granting the
#   workflow a ruleset bypass.
#
# Third-party actions are pinned to a full commit SHA, not a tag, per
# AGENTS.md supply-chain guidance.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute the rollup and print the redacted public version to the log; publish nothing"
        type: boolean
        default: true
  schedule:
    # Daily at 09:00 UTC. Repositories unchanged since their last scan skip
    # the PR/CI work (policy/scan-state.cjs), so a daily run is cheap and the
    # dashboard snapshot is rarely more than a day old.
    - cron: '0 9 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write # start and watch the CI check on the data-update PR
  pages: write   # request a Pages build after merging (see Publish step)

concurrency:
  group: maintenance-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Generate maintenance rollup
    runs-on: ubuntu-latest
    timeout-minutes: 30 # up to 200 repositories plus npm registry lookups
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run policy and schema tests
        run: npm test

      - name: Determine dry-run mode
        id: mode
        run: |
          # Scheduled runs are never dry-run (they need to publish an artifact to be useful).
          # Manual (workflow_dispatch) runs default to dry-run unless explicitly disabled.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate maintenance rollup
        id: generate
        env:
          MAINTENANCE_RO_TOKEN: ${{ secrets.MAINTENANCE_RO_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            node scripts/generate-maintenance-rollup.cjs --dry-run
          else
            node scripts/generate-maintenance-rollup.cjs
          fi

      - name: Upload full rollup artifact (private, exact alert counts)
        if: steps.mode.outputs.dry_run != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-rollup
          path: maintenance-rollup.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish scan-state and public rollup via a PR (passes through the required check like any other change)
        if: steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- maintenance-scan-state.json maintenance-rollup.public.json; then
            echo "Nothing changed; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="maintenance-rollup-update-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add maintenance-scan-state.json maintenance-rollup.public.json
          git commit -m "Update maintenance rollup (automated, run ${{ github.run_id }})"
          git push origin "$BRANCH"

          gh pr create --title "Update maintenance rollup" \
            --body "Automated update from the Maintenance Inventory workflow (run ${{ github.run_id }}). Contains only maintenance-scan-state.json and maintenance-rollup.public.json (no exact alert counts — see policy/public-redaction.cjs)." \
            --base main --head "$BRANCH"

          # GITHUB_TOKEN pushes never trigger pull_request workflows, so the
          # required "npm test" check would never start (and `gh pr checks
          # --watch` fails with "no checks reported"). Dispatch CI on the
          # branch explicitly; its check run lands on the PR's head commit.
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for attempt in $(seq 1 20); do
            sleep 6
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::CI did not start on $BRANCH; the data PR is left open for a human to merge."
            exit 0
          fi

          # Same gate as any other change to main — no ruleset bypass. The job
          # timeout above is the backstop if the check hangs.
          if ! gh run watch "$RUN_ID" --exit-status; then
            echo "::error::npm test failed on the data PR; it is left open for review."
            exit 1
          fi

          gh pr merge "$BRANCH" --squash --delete-branch

          # A merge made with GITHUB_TOKEN does not trigger the Pages build
          # either, so the dashboard would keep serving the previous rollup.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            || echo "::warning::Could not request a Pages build; it will deploy with the next push to main."
