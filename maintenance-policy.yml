# Maintenance policy for the tune-my-repos control plane.
#
# This file is the single source of truth for how Dependabot updates and
# security alerts are classified and routed. It is deterministic and
# versioned: no AI is involved in evaluating it, and no implicit allow-all
# behaviour exists. Every dependency class defaults to needs_review unless
# explicitly marked eligible below.
#
# Schema: see policy/policy.schema.json

policy_version: "1.0.0"

# Controls auto-discovery of repositories via the GitHub API (scripts/
# generate-maintenance-rollup.js), as an alternative to listing every
# repository by hand in repositories.include below. Discovery finds
# candidate repositories; repositories.include/exclude (below) is still
# applied afterward as the final filter, so an owner being listed here does
# not bypass an explicit exclude pattern there.
discovery:
  # Only repositories owned by one of these GitHub users/orgs are
  # considered. This is the actual restriction on scan scope: the
  # authenticated token may have access to many more orgs than this.
  owners:
    - "mgifford"
    # - "CivicActions" # add once mgifford's own repos are reviewed and confirmed working
  exclude_forks: true
  exclude_archived: true
  # At most this many repositories are scanned (alerts + PRs + CI status)
  # in a single workflow run, oldest-last-scanned first. Keeps each
  # scheduled run fast and rate-limit-safe even when discovery finds
  # hundreds of candidate repositories; coverage builds up over several
  # runs via maintenance-scan-state.json rather than all at once.
  max_repos_per_run: 50
  # A repository whose pushed_at is unchanged since its last full scan
  # skips the expensive PR/CI-status work, but its Dependabot alerts are
  # always re-checked regardless (cheap, and a new CVE can appear against
  # an already-installed version with no new push).
  rescan_prs_after_days: 7

# Repositories this policy applies to. "include" patterns are evaluated
# first; "exclude" patterns remove matches afterward. Patterns are
# "owner/repo" exact strings or "owner/*" glob-style prefixes. Discovery
# results (above) still pass through this filter, so widening discovery.owners
# alone does not expand what actually gets scanned — include must be widened
# too (e.g. to "mgifford/*", "CivicActions/*") once ready to scan beyond the
# pilot repository.
repositories:
  include:
    - "mgifford/*"
  exclude: []

# Repository tiers control how much autonomy a repo's workflow may use.
# A repo not listed here defaults to tier "manual" (no auto-merge path).
tiers:
  pilot:
    - "mgifford/tune-my-repos"
  standard: []
  archive: []
  manual: []

# Dependency class -> merge eligibility rules.
# Every class must resolve to one risk_state. There is no implicit default:
# an update that cannot be classified into one of these classes must be
# treated as "unknown" and risk_state "needs_review".
dependency_classes:
  github-actions:
    description: "Updates to .github/workflows/*.yml action references"
    patch:
      risk_state: eligible
      requires: [required_ci_pass]
    minor:
      risk_state: eligible
      requires: [required_ci_pass]
    major:
      risk_state: needs_review
      requires: []

  development:
    description: "devDependencies / test-only / lint-only packages"
    patch:
      risk_state: eligible
      requires: [required_ci_pass]
    minor:
      risk_state: eligible
      requires: [required_ci_pass]
    major:
      risk_state: needs_review
      requires: []

  production:
    description: "Runtime dependencies shipped to users"
    patch:
      risk_state: needs_review
      requires: []
    minor:
      risk_state: needs_review
      requires: []
    major:
      risk_state: needs_review
      requires: []

  major:
    description: "Any update classified as a major/breaking version bump, regardless of dependency class"
    any:
      risk_state: needs_review
      requires: []

  unknown:
    description: "Dependency class could not be determined from manifest or PR metadata"
    any:
      risk_state: needs_review
      requires: []

# Cases that must always be explicitly classified and never silently
# auto-approved, even if they look like a low-risk patch bump.
special_cases:
  workflow_permission_change:
    risk_state: blocked
    reason: "PR modifies permissions: block in a workflow file"
  lockfile_only_change:
    risk_state: needs_review
    reason: "Lockfile-only diffs can mask transitive dependency changes"
  generated_output_change:
    risk_state: needs_review
    reason: "Generated/build output changes are not human-reviewable diffs"
  requires_secret_or_elevated_access:
    risk_state: blocked
    reason: "Update requires a new secret or elevated workflow permission"
  failing_required_check:
    risk_state: needs_repair
    reason: "One or more required CI checks failed"

# Thresholds that determine whether an item needs weekly human attention,
# independent of its risk_state.
attention_thresholds:
  max_age_days_open_pr: 14
  max_age_days_open_alert_by_severity:
    critical: 2
    high: 7
    moderate: 30
    low: 90

# Explicit, time-boxed overrides. Each override must state a reason and an
# expiry date; expired overrides are ignored by the validator and must be
# re-justified or removed.
overrides: []
# Example override shape:
# - repository: "mgifford/example-repo"
#   dependency_name: "left-pad"
#   ecosystem: "npm"
#   risk_state: eligible
#   reason: "Pinned patch-only update, manually reviewed 2026-10-01"
#   expires: "2026-12-01"
